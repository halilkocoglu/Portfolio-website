<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Sayfa Bulunamadı | Halil İbrahim Koçoğlu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #0f172a;
            background-color: #f5f3ff;
            background-image:
                radial-gradient(ellipse at 10% 30%, rgba(139, 92, 246, 0.14) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 10%, rgba(236, 72, 153, 0.09) 0%, transparent 50%),
                radial-gradient(ellipse at 55% 85%, rgba(99, 102, 241, 0.10) 0%, transparent 50%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
        }

        .wrap {
            max-width: 32rem;
        }

        .code {
            font-size: 6rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 0.75rem;
        }

        p {
            margin-top: 0.75rem;
            color: #475569;
            font-size: 1rem;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 1.75rem;
            padding: 0.75rem 1.75rem;
            border-radius: 9999px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">404</div>
        <h1>Sayfa Bulunamadı</h1>
        <p>Aradığınız sayfa kaldırılmış, taşınmış veya hiç var olmamış olabilir.</p>
        <a class="btn" href="/">Ana Sayfaya Dön</a>
    </div>
</body>
</html>
